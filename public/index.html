<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Desktopy OS — a browser-based desktop whose windows, files and settings persist through a single-file PHP backend.">
    <title>Desktopy OS</title>

    <!-- Google Fonts: Tajawal (Arabic), Space Grotesk (English), Fira Code (Terminal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        ar: ['Tajawal', 'sans-serif'],
                        en: ['Space Grotesk', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        os: { 900: '#0f1115', 800: '#1a1d24', 700: '#272b36', accent: '#6366f1' }
                    }
                }
            }
        }
    </script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --font-primary: 'Tajawal', sans-serif;
            --accent: #6366f1;
            --accent-2: #a78bfa;
            --accent-rgb: 99, 102, 241;
        }

        html[lang="en"] {
            --font-primary: 'Space Grotesk', sans-serif;
        }

        body.accent-emerald {
            --accent: #10b981;
            --accent-2: #34d399;
            --accent-rgb: 16, 185, 129;
        }

        body.accent-rose {
            --accent: #f43f5e;
            --accent-2: #fb7185;
            --accent-rgb: 244, 63, 94;
        }

        body.accent-amber {
            --accent: #f59e0b;
            --accent-2: #fbbf24;
            --accent-rgb: 245, 158, 11;
        }

        body.accent-cyan {
            --accent: #06b6d4;
            --accent-2: #22d3ee;
            --accent-rgb: 6, 182, 212;
        }

        body.accent-violet {
            --accent: #8b5cf6;
            --accent-2: #c4b5fd;
            --accent-rgb: 139, 92, 246;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-primary);
            overflow: hidden;
            user-select: none;
            color: #e5e7eb;
            background: radial-gradient(1300px 750px at 50% -10%, #31449b 0%, #141f38 45%, #05070d 100%);
            transition: background .6s ease, color .6s ease;
        }

        body.light {
            color: #1e293b;
            background: radial-gradient(1300px 780px at 50% -10%, #d9eaff 0%, #f3f8ff 55%, #ffffff 100%);
        }

        .text-accent {
            color: var(--accent);
        }

        .ambient-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .ambient-grid {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
            background-size: 38px 38px;
            opacity: .35;
            mask-image: radial-gradient(circle at 50% 40%, black 25%, transparent 78%);
        }

        body.light .ambient-grid {
            background-image:
                linear-gradient(rgba(28, 57, 109, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(28, 57, 109, 0.07) 1px, transparent 1px);
        }

        .ambient-glow::before,
        .ambient-glow::after {
            content: "";
            position: absolute;
            border-radius: 9999px;
            filter: blur(70px);
            opacity: .5;
            animation: pulse-float 9s ease-in-out infinite;
        }

        .ambient-glow::before {
            width: 420px;
            height: 420px;
            top: 12%;
            left: 8%;
            background: radial-gradient(circle, rgba(76, 155, 255, 0.7) 0%, rgba(76, 155, 255, 0) 70%);
        }

        .ambient-glow::after {
            width: 360px;
            height: 360px;
            right: 8%;
            bottom: 10%;
            background: radial-gradient(circle, rgba(70, 230, 176, 0.6) 0%, rgba(70, 230, 176, 0) 70%);
            animation-delay: 1.6s;
        }

        body.light .ambient-glow::before,
        body.light .ambient-glow::after {
            opacity: .3;
        }

        .ambient-aurora {
            background:
                radial-gradient(600px 300px at 85% 85%, rgba(139, 92, 246, 0.16), transparent 60%),
                radial-gradient(500px 260px at 15% 75%, rgba(6, 182, 212, 0.12), transparent 60%);
            animation: aurora 14s ease-in-out infinite alternate;
        }

        body.light .ambient-aurora {
            opacity: .5;
        }

        /* Premium Glassmorphism */
        .glass-panel {
            background: linear-gradient(135deg, rgba(13, 20, 36, 0.66), rgba(10, 15, 28, 0.44));
            backdrop-filter: blur(26px) saturate(1.3);
            -webkit-backdrop-filter: blur(26px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
        }

        body.light .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(240, 248, 255, 0.7));
            border: 1px solid rgba(12, 30, 78, 0.1);
            box-shadow: 0 16px 34px rgba(58, 77, 120, 0.14);
        }

        /* Desktop widgets */
        .desktop-widget {
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, rgba(19, 28, 44, 0.6), rgba(11, 17, 29, 0.38));
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            animation: float-in .6s ease both;
        }

        body.light .desktop-widget {
            border-color: rgba(15, 56, 124, 0.1);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(244, 250, 255, 0.72));
            box-shadow: 0 12px 28px rgba(56, 90, 140, 0.12);
        }

        .accent-chip {
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.07);
        }

        body.light .accent-chip {
            border-color: rgba(11, 63, 135, 0.14);
            background: rgba(255, 255, 255, 0.72);
        }

        /* Window Mechanics */
        .os-window {
            position: absolute;
            display: flex;
            flex-direction: column;
            border-radius: .85rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.92), rgba(9, 13, 22, 0.88));
            box-shadow: 0 40px 70px -30px rgba(0, 0, 0, 0.85);
            transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .22s, box-shadow .3s, border-color .3s;
            animation: win-in .24s cubic-bezier(.2, .8, .2, 1) both;
        }

        body.light .os-window {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(238, 244, 252, 0.95));
            box-shadow: 0 30px 60px -20px rgba(23, 44, 82, 0.24);
        }

        .os-window.focused {
            border-color: rgba(var(--accent-rgb), 0.55);
            box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(var(--accent-rgb), 0.3),
                0 0 34px -8px rgba(var(--accent-rgb), 0.35);
        }

        .os-window.minimized {
            transform: scale(.82) translateY(140px);
            opacity: 0;
            pointer-events: none;
        }

        .os-window.maximized {
            border-radius: .55rem;
        }

        .os-window.dragging {
            transition: none;
            opacity: .92;
        }

        .window-header {
            cursor: grab;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0));
        }

        body.light .window-header {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.05), rgba(15, 23, 42, 0));
        }

        .window-header:active {
            cursor: grabbing;
        }

        .traffic {
            width: 12px;
            height: 12px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter .15s;
        }

        .traffic i {
            opacity: 0;
            transition: opacity .15s;
            font-size: 7px;
        }

        .traffic:hover i {
            opacity: 1;
        }

        .resize-handle {
            position: absolute;
            z-index: 20;
        }

        .resize-handle[data-dir="se"] { bottom: -3px; right: -3px; width: 18px; height: 18px; cursor: se-resize; }
        .resize-handle[data-dir="sw"] { bottom: -3px; left: -3px; width: 18px; height: 18px; cursor: sw-resize; }
        .resize-handle[data-dir="ne"] { top: -3px; right: -3px; width: 18px; height: 18px; cursor: ne-resize; }
        .resize-handle[data-dir="nw"] { top: -3px; left: -3px; width: 18px; height: 18px; cursor: nw-resize; }
        .resize-handle[data-dir="e"]  { top: 0; right: -3px; bottom: 0; width: 8px; cursor: e-resize; }
        .resize-handle[data-dir="w"]  { top: 0; left: -3px; bottom: 0; width: 8px; cursor: w-resize; }
        .resize-handle[data-dir="s"]  { left: 0; bottom: -3px; right: 0; height: 8px; cursor: s-resize; }
        .resize-handle[data-dir="n"]  { left: 0; top: -3px; right: 0; height: 8px; cursor: n-resize; }

        /* Launcher */
        #launcher-overlay {
            transition: opacity .3s ease, backdrop-filter .3s ease;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(0px);
            background: linear-gradient(150deg, rgba(7, 13, 24, 0.82), rgba(7, 10, 19, 0.74));
        }

        #launcher-overlay.active {
            opacity: 1;
            pointer-events: auto;
            backdrop-filter: blur(26px);
        }

        body.light #launcher-overlay {
            background: linear-gradient(150deg, rgba(240, 246, 255, 0.86), rgba(250, 252, 255, 0.82));
        }

        .launch-tile {
            transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .18s;
        }

        .launch-tile:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
        }

        body.light .launch-tile:hover {
            background: rgba(15, 23, 42, 0.06);
        }

        .launch-icon {
            transition: transform .18s cubic-bezier(.2, .8, .2, 1);
        }

        .launch-tile:hover .launch-icon {
            transform: scale(1.12) translateY(-2px);
        }

        /* Dock */
        .dock-btn {
            width: 44px;
            height: 44px;
            border-radius: .8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .18s;
        }

        .dock-btn:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        body.light .dock-btn:hover {
            background: rgba(15, 23, 42, 0.07);
        }

        .dock-btn .dot {
            position: absolute;
            bottom: 2px;
            width: 4px;
            height: 4px;
            border-radius: 9999px;
            background: rgba(156, 163, 175, 0.9);
        }

        .dock-btn.running .dot {
            background: var(--accent);
        }

        .dock-tip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(10, 14, 24, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e5e7eb;
            padding: 4px 9px;
            border-radius: .55rem;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s, transform .15s;
            z-index: 40;
        }

        .dock-btn:hover .dock-tip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        body.light .dock-tip {
            background: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            border-color: rgba(15, 23, 42, 0.12);
        }

        /* Toasts */
        .toast {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: .7rem;
            font-size: 12px;
            background: rgba(10, 14, 24, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e5e7eb;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(14px);
            border-inline-start: 3px solid var(--accent);
            animation: toast-in .25s cubic-bezier(.2, .8, .2, 1) both;
        }

        body.light .toast {
            background: rgba(255, 255, 255, 0.96);
            color: #1e293b;
            border-color: rgba(15, 23, 42, 0.1);
        }

        .toast.ok { border-inline-start-color: #34d399; }
        .toast.warn { border-inline-start-color: #fbbf24; }
        .toast.err { border-inline-start-color: #f87171; }

        /* Context menu */
        .ctx-menu {
            min-width: 190px;
            background: rgba(10, 14, 24, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: .7rem;
            padding: 5px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            animation: float-in .14s ease both;
            overflow: hidden;
        }

        body.light .ctx-menu {
            background: rgba(255, 255, 255, 0.97);
            border-color: rgba(15, 23, 42, 0.1);
        }

        .ctx-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 10px;
            border-radius: .5rem;
            font-size: 12.5px;
            cursor: pointer;
            transition: background .12s;
        }

        .ctx-item:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        body.light .ctx-item:hover {
            background: rgba(15, 23, 42, 0.06);
        }

        .ctx-item.danger {
            color: #fca5a5;
        }

        .ctx-item.danger:hover {
            background: rgba(248, 113, 113, 0.15);
        }

        .ctx-sep {
            height: 1px;
            background: rgba(255, 255, 255, 0.09);
            margin: 5px 8px;
        }

        body.light .ctx-sep {
            background: rgba(15, 23, 42, 0.09);
        }

        /* Modals */
        #modal-root {
            background: rgba(4, 7, 15, 0.5);
            backdrop-filter: blur(6px);
            animation: fade-in .18s ease both;
        }

        .modal-card {
            width: 100%;
            max-width: 380px;
            background: rgba(13, 19, 32, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 1rem;
            padding: 20px;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
            animation: float-in .2s cubic-bezier(.2, .8, .2, 1) both;
        }

        body.light .modal-card {
            background: rgba(255, 255, 255, 0.99);
            border-color: rgba(15, 23, 42, 0.12);
        }

        .modal-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: .6rem;
            padding: 8px 12px;
            font-size: 13px;
            color: inherit;
            outline: none;
            transition: border-color .15s;
        }

        .modal-input:focus {
            border-color: var(--accent);
        }

        body.light .modal-input {
            background: rgba(15, 23, 42, 0.05);
            border-color: rgba(15, 23, 42, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-weight: 600;
            border-radius: .6rem;
            padding: 7px 14px;
            font-size: 12.5px;
            transition: filter .15s, transform .1s;
            cursor: pointer;
        }

        .btn-primary:hover { filter: brightness(1.12); }
        .btn-primary:active { transform: scale(.96); }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: .6rem;
            padding: 7px 14px;
            font-size: 12.5px;
            transition: background .15s;
            cursor: pointer;
        }

        .btn-ghost:hover { background: rgba(255, 255, 255, 0.14); }

        body.light .btn-ghost {
            background: rgba(15, 23, 42, 0.06);
            border-color: rgba(15, 23, 42, 0.12);
        }

        body.light .btn-ghost:hover { background: rgba(15, 23, 42, 0.1); }

        /* Misc */
        kbd {
            font-family: var(--font-primary);
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        .shimmer {
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        @keyframes float-in {
            from { transform: translateY(12px) scale(.97); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes win-in {
            from { transform: scale(.93) translateY(16px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes toast-in {
            from { transform: translateY(14px) scale(.96); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes pulse-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.07); }
        }

        @keyframes aurora {
            0% { transform: translateX(-3%) rotate(0deg); }
            100% { transform: translateX(3%) rotate(2deg); }
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.28);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.45);
        }
    </style>
</head>

<body class="w-screen h-screen relative text-gray-200">
    <div class="ambient-layer ambient-grid"></div>
    <div class="ambient-layer ambient-glow"></div>
    <div class="ambient-layer ambient-aurora"></div>

    <!-- Top Status Bar -->
    <div
        class="h-9 w-full glass-panel fixed top-0 start-0 end-0 z-[100] flex items-center justify-between px-3 text-xs font-medium border-b border-white/5">
        <div class="flex items-center gap-1">
            <button onclick="toggleLauncher()"
                class="hover:bg-white/10 rounded-lg px-3 py-1.5 transition flex items-center gap-2 cursor-pointer">
                <i class="ph ph-squares-four text-lg text-indigo-300"></i>
                <span data-i18n="activities">الأنشطة</span>
            </button>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <button onclick="focusActiveApp()"
                class="hidden md:flex items-center gap-2 hover:bg-white/10 rounded-lg px-3 py-1.5 transition cursor-pointer max-w-[240px]">
                <div id="active-app-title" class="font-bold text-accent truncate">Desktopy OS</div>
            </button>
        </div>

        <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-3" dir="ltr">
            <span id="top-date" class="text-gray-400"></span>
            <span id="top-time" class="font-bold tabular-nums text-gray-100"></span>
        </div>

        <div class="flex items-center gap-2">
            <img src="logo.png" alt="Logo" class="h-5 w-auto rounded">
            <button onclick="toggleLang()" id="btn-lang"
                class="bg-white/10 hover:bg-white/20 rounded-lg px-2.5 py-1 transition cursor-pointer font-bold text-[11px]">EN</button>
            <button onclick="toggleTheme()" class="hover:bg-white/10 rounded-lg p-1.5 transition cursor-pointer"
                title="Toggle theme">
                <i id="theme-icon" class="ph ph-moon text-lg"></i>
            </button>
            <div class="flex items-center gap-1.5 text-gray-400" dir="ltr">
                <i class="ph ph-wifi-high text-sm"></i>
                <i class="ph ph-speaker-high text-sm"></i>
                <i class="ph ph-battery-full text-sm text-green-400"></i>
            </div>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <button onclick="resetDesktopConfirm()" class="hover:bg-red-500/20 hover:text-red-300 rounded-lg p-1.5 transition cursor-pointer"
                title="Reset desktop">
                <i class="ph ph-power text-lg"></i>
            </button>
        </div>
    </div>

    <!-- Desktop Widgets -->
    <div id="desktop-area"
        class="absolute top-14 bottom-16 start-0 end-0 p-5 z-10 flex flex-col flex-wrap content-start gap-4 pointer-events-none">
        <div class="desktop-widget p-4 w-64 text-xs pointer-events-auto" style="animation-delay: .08s">
            <div class="flex items-center justify-between mb-3">
                <span class="flex items-center gap-2 text-gray-400 font-medium">
                    <i class="ph ph-shield-check text-indigo-300"></i> Kernel Health
                </span>
                <span class="accent-chip rounded-full px-2 py-0.5 text-[10px] flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span>Stable
                </span>
            </div>
            <div class="flex items-end justify-between mb-2">
                <div class="text-2xl font-bold" dir="ltr">99.98%</div>
                <div class="text-[10px] text-gray-500">uptime 12d 4h</div>
            </div>
            <div class="w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
                <div class="h-full rounded-full shimmer"
                    style="width: 82%; background: linear-gradient(90deg, var(--accent), var(--accent-2));"></div>
            </div>
        </div>

        <div class="desktop-widget p-4 w-64 text-xs pointer-events-auto" style="animation-delay: .16s">
            <div class="flex items-center justify-between mb-3">
                <span class="flex items-center gap-2 text-gray-400 font-medium">
                    <i class="ph ph-chart-line-up text-emerald-300"></i> System
                </span>
                <span class="accent-chip rounded-full px-2 py-0.5 text-[10px]">Live</span>
            </div>
            <div class="space-y-3">
                <div>
                    <div class="flex justify-between mb-1">
                        <span class="text-gray-500">CPU</span>
                        <span class="tabular-nums" id="w-cpu">—</span>
                    </div>

    <script>
        /* ============================================================

         * Windows, files and settings persist via the single-file PHP
         * backend (api.php). When PHP is unreachable we fall back to
         * localStorage so the desktop still works anywhere.
         * ============================================================ */

        /* ---------- i18n ---------- */
        const i18n = {

                calendar: "Calendar", music: "Music", video: "Video", camera: "Camera",

                db: "Databases", api: "API Tester", regex: "Regex Tester",
                hash: "Hash Gen", base64: "Base64", json: "JSON Format",
                qr: "QR Generator", password: "Passwords", color: "Color Picker",
                unit: "Units", currency: "Currency", stop: "Stopwatch",
                pomodoro: "Pomodoro", fitness: "Fitness", recipes: "Recipes",
                expenses: "Expenses", stock: "Stocks", news: "News",
                books: "Books", podcasts: "Podcasts", piano: "Piano",
                ok: "OK", cancel: "Cancel", close: "Close", confirm: "Confirm",
                delete: "Delete", rename: "Rename", refresh: "Refresh",
                new_file: "New File", new_folder: "New Folder", preview: "Preview",
                back: "Back", up: "Up", empty_folder: "This folder is empty",
                name: "Name", size: "Size", modified: "Modified", items: "items",
                folder: "Folder", file: "File", backend_online: "PHP backend online",
                backend_offline: "PHP backend offline — saving locally in the browser",
                state_saved: "Desktop state saved", accent_color: "Accent Color",
                theme_mode: "Theme Mode", language: "Language", system: "System", appearance: "Appearance",
                about: "About", storage: "Storage", reset_desktop: "Reset Desktop",
                reset_confirm: "This deletes all saved state and reloads. Continue?",
                new_terminal: "New Terminal", open_settings: "Settings",
                new_folder_prompt: "New folder name", new_file_prompt: "New file name",
                rename_prompt: "New name", delete_confirm: "Delete this item?",
                dark: "Dark", light: "Light", online: "Online", offline: "Offline",
                version: "Version", name_prompt: "Name", items_count: "items",
                preview_of: "Preview of", saving: "Saving...", saved: "Saved",
                error: "Error", file_deleted: "File deleted", created: "Created",
                renamed: "Renamed", saved_file: "File saved"
            }
        };

        const T = (k) => (i18n[state.lang] && i18n[state.lang][k]) || k;

        // Escape user/file content before it touches innerHTML.
        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        /* ---------- state ---------- */
        const state = {
            lang: 'ar',
            theme: 'dark',
            accent: 'indigo',
            launcherOpen: false,
            notes: '',
            history: [],
            zIndexCounter: 100,
            windows: {},          // id -> { element, minimized, maximized, rect, z }
            backend: false,       // is the PHP backend reachable?
            activeId: null
        };

        /* ---------- PHP backend client (single-file api.php) ---------- */
        const Backend = {
            base: 'api.php',
            async call(action, params = {}, method = 'GET', body = null) {
                const qs = new URLSearchParams(params).toString();
                const url = `${this.base}?action=${action}${qs ? '&' + qs : ''}`;
                const opts = {
                    method,
                    headers: body ? { 'Content-Type': 'application/json' } : {},
                    keepalive: method === 'POST'
                };
                if (body) opts.body = JSON.stringify(body);
                try {
                    const res = await fetch(url, opts);
                    return await res.json();
                } catch (e) {
                    return { ok: false, error: String((e && e.message) || e) };
                }
            },
            async init() {
                const r = await this.call('ping');
                this.available = !!(r && r.ok);
                this.phpVersion = (r && r.php) ? r.php : null;
                return this.available;
            },
            loadState: () => Backend.call('state'),
            saveState: (data) => Backend.call('state', {}, 'POST', { data }),
            reset: () => Backend.call('reset', {}, 'POST'),
            ls: (path) => Backend.call('ls', { path }),
            read: (path) => Backend.call('read', { path }),
            write: (path, content) => Backend.call('write', {}, 'POST', { path, content }),
            mkdir: (path) => Backend.call('mkdir', {}, 'POST', { path }),
            rm: (path) => Backend.call('rm', {}, 'POST', { path }),
            mv: (path, dest) => Backend.call('mv', {}, 'POST', { path, dest }),
            disk: () => Backend.call('disk')
        };

        /* ---------- persistence ---------- */
        function snapshot() {
            const wins = {};
            for (const id in state.windows) {
                const w = state.windows[id];
                const rect = w.rect || currentRect(w.element);
                wins[id] = {
                    x: Math.round(rect.x),
                    y: Math.round(rect.y),
                    w: Math.round(rect.w),
                    h: Math.round(rect.h),
                    minimized: !!w.minimized,
                    maximized: !!w.maximized,
                    z: w.z || 0
                };
            }
            return {
                theme: state.theme,
                lang: state.lang,
                accent: state.accent,
                launcher: state.launcherOpen,
                notes: state.notes,
                history: state.history,
                zIndex: state.zIndexCounter,
                windows: wins
            };
        }

        function fallbackSave(snap) {
            try { localStorage.setItem('desktopy:state', JSON.stringify(snap)); } catch (e) { /* ignore */ }
        }

        function fallbackLoad() {
            try {
                const raw = localStorage.getItem('desktopy:state');
                if (raw) return { fresh: false, data: JSON.parse(raw) };
            } catch (e) { /* ignore */ }
            return { fresh: true, data: null };
        }

        async function loadPersisted() {
            if (state.backend) {
                const r = await Backend.loadState();
                if (r && r.ok) return { fresh: !!r.fresh, data: r.data };
            }
            return fallbackLoad();
        }

        function saveStateNow() {
            if (state.suppressSave) return;
            const snap = snapshot();
            const done = () => document.dispatchEvent(new CustomEvent('desktopy:saved'));
            if (state.backend) {
                Backend.saveState(snap).then((r) => {
                    if (!r.ok) fallbackSave(snap);
                    done();
                }).catch(() => { fallbackSave(snap); done(); });
            } else {
                fallbackSave(snap);
                done();
            }
        }

        let saveTimer = null;
        function saveStateDebounced() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveStateNow, 400);
        }

        function flushSave() {
            clearTimeout(saveTimer);
            saveStateNow();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') flushSave();
        });
        window.addEventListener('beforeunload', flushSave);

        /* ---------- toasts ---------- */
        function toast(msg, type = 'info', ms = 2600) {
            const root = document.getElementById('toasts');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            const icon = type === 'ok' ? 'ph-check-circle' : type === 'warn' ? 'ph-warning' : type === 'err' ? 'ph-x-circle' : 'ph-info';
            el.innerHTML = `<i class="ph ${icon} text-base"></i><span>${msg}</span>`;
            root.appendChild(el);
            setTimeout(() => {
                el.style.transition = 'opacity .3s, transform .3s';
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                setTimeout(() => el.remove(), 320);
            }, ms);
        }

        /* ---------- modals (prompt / confirm / preview) ---------- */
        let modalActive = false;

        function openModal({ title, html, buttons, onOpen }) {
            if (modalActive) return Promise.resolve(null);
            modalActive = true;
            const root = document.getElementById('modal-root');
            root.classList.remove('hidden');
            root.innerHTML = `
                <div class="modal-card">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-sm">${title}</h3>
                        <button onclick="closeModal(null)" class="text-gray-500 hover:text-gray-300 transition cursor-pointer"><i class="ph ph-x text-lg"></i></button>
                    </div>
                    ${html}
                    <div class="flex justify-end gap-2 mt-5" id="modal-actions"></div>
                </div>`;
            const actions = document.getElementById('modal-actions');
            buttons.forEach((b) => {
                const btn = document.createElement('button');
                btn.className = b.kind === 'primary' ? 'btn-primary' : 'btn-ghost';
                btn.innerText = b.label;
                btn.onclick = () => closeModal(b.value !== undefined ? b.value : b.label);
                actions.appendChild(btn);
            });
            if (onOpen) onOpen(root);
            return new Promise((resolve) => {
                root.dataset.resolve = '';
                root._resolve = resolve;
            });
        }

        function closeModal(value) {
            const root = document.getElementById('modal-root');
            if (!modalActive) return;
            modalActive = false;
            root.classList.add('hidden');
            root.innerHTML = '';
            if (root._resolve) root._resolve(value);
            root._resolve = null;
        }

        function promptBox(title, defValue = '', placeholder = '') {
            let val = defValue;
            return openModal({
                title: esc(title),
                html: `<input type="text" id="modal-input" class="modal-input" value="${esc(defValue)}" placeholder="${esc(placeholder)}">`,
                buttons: [
                    { label: T('cancel'), value: null },
                    { label: T('ok'), kind: 'primary', value: '__ok__' }
                ],
                onOpen: (root) => {
                    const inp = root.querySelector('#modal-input');
                    inp.focus();
                    inp.select();
                    inp.addEventListener('input', () => { val = inp.value; });
                    inp.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') closeModal('__ok__');
                        if (e.key === 'Escape') closeModal(null);
                    });
                }
            }).then((v) => (v === '__ok__' ? val : null));
        }

        function confirmBox(title, message, okLabel) {
            return openModal({
                title,
                html: `<p class="text-xs text-gray-400 leading-relaxed">${message}</p>`,
                buttons: [
                    { label: T('cancel'), value: false },
                    { label: okLabel || T('confirm'), kind: 'primary', value: true }
                ]
            }).then((v) => v === true);
        }

        function previewBox(title, content) {
            return openModal({
                title: esc(title),
                html: `<pre class="max-h-[46vh] overflow-auto bg-white/5 border border-white/10 rounded-lg p-3 text-[11px] leading-relaxed font-mono whitespace-pre-wrap" dir="ltr">${esc(content)}</pre>`,
                buttons: [{ label: T('close'), kind: 'primary', value: true }]
            });
        }

        /* ---------- context menu ---------- */
        function showContextMenu(x, y, items) {
            const menu = document.getElementById('ctx-menu');
            menu.innerHTML = `<div class="ctx-menu">${items.map((it) => it.sep
                ? '<div class="ctx-sep"></div>'
                : `<div class="ctx-item ${it.danger ? 'danger' : ''}" data-k="${it.key}"><i class="ph ph-${it.icon} text-sm"></i><span>${it.label}</span></div>`
            ).join('')}</div>`;
            menu.classList.remove('hidden');
            const w = menu.offsetWidth, h = menu.offsetHeight;
            menu.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
            menu.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
            menu.querySelectorAll('.ctx-item').forEach((el) => {
                el.onclick = (e) => {
                    e.stopPropagation();
                    hideContextMenu();
                    const it = items.find((i) => i.key === el.dataset.k);
                    if (it && it.action) it.action();
                };
            });
        }

        function hideContextMenu() {
            const menu = document.getElementById('ctx-menu');
            menu.classList.add('hidden');
            menu.innerHTML = '';
        }

        document.addEventListener('click', hideContextMenu);
        document.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('.os-window')) {
                e.preventDefault();
                showDesktopMenu(e.clientX, e.clientY);
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideContextMenu();
                closeModal(null);
                if (state.launcherOpen) toggleLauncher();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                toggleLauncher();
            }
        });

        /* ---------- apps registry ---------- */
        const apps = {
            terminal: { icon: 'terminal-window', color: 'text-green-400', pinned: true, size: [680, 440], run: (id, el) => buildTerminal(id, el) },
            files: { icon: 'folder-open', color: 'text-blue-400', pinned: true, size: [820, 520], run: (id, el) => buildFiles(id, el) },
            editor: { icon: 'notepad', color: 'text-blue-300', pinned: true, size: [640, 480], run: (id, el) => buildEditor(id, el) },
            settings: { icon: 'gear', color: 'text-gray-300', pinned: true, size: [680, 500], run: (id, el) => buildSettings(id, el) },
            calc: { icon: 'calculator', color: 'text-orange-400', pinned: true, size: [360, 520], run: (id, el) => buildCalculator(id, el) },
            paint: { icon: 'palette', color: 'text-pink-400', pinned: true, size: [720, 540], run: (id, el) => buildPaint(id, el) },
            code: { icon: 'code', color: 'text-indigo-400', pinned: true, size: [720, 480], run: (id, el) => buildCode(id, el) },
            monitor: { icon: 'chart-line-up', color: 'text-red-400', pinned: false, size: [720, 500], run: (id, el) => buildMonitor(id, el) },
            tictactoe: { icon: 'hash', color: 'text-purple-400', pinned: false, size: [380, 440], run: (id, el) => buildTicTacToe(id, el) },
            regex: { icon: 'brackets-curly', color: 'text-yellow-400', pinned: false, size: [560, 400], run: (id, el) => buildGeneric(id, el, 'PCRE engine active. /^([a-z0-9_.-]+)@([da-z.-]+).([a-z.]{2,6})$/', true) },
            base64: { icon: 'arrows-left-right', color: 'text-blue-300', pinned: false, size: [560, 400], run: (id, el) => buildGeneric(id, el, 'Encoder ready. RXhhbXBsZSBCYXNlNjQgU3RyaW5n', true) },
            browser: { icon: 'globe', color: 'text-cyan-400', pinned: true, size: [760, 520], run: (id, el) => buildGeneric(id, el, 'Webkit wrapper mock initialized.') },
            tasks: { icon: 'check-square', color: 'text-green-500', pinned: false, size: [560, 420], run: (id, el) => buildGeneric(id, el, 'Task manager loaded.') },
            weather: { icon: 'cloud-sun', color: 'text-yellow-500', pinned: false, size: [560, 420], run: (id, el) => buildGeneric(id, el, 'Fetching Bahrain MET data...') },
            clock: { icon: 'clock', color: 'text-gray-300', pinned: false, size: [560, 420], run: (id, el) => buildGeneric(id, el, 'Timezone synced with host.') },
            calendar: { icon: 'calendar-blank', color: 'text-red-500', pinned: false, size: [560, 420], run: (id, el) => buildGeneric(id, el, 'Event matrix loaded.') },
            store: { icon: 'shopping-bag', color: 'text-orange-500', pinned: false, size: [560, 420], run: (id, el) => buildGeneric(id, el, 'Fetching apt repositories.') },
            sysinfo: { icon: 'info', color: 'text-gray-300', pinned: false, size: [560, 420], run: (id, el) => buildGeneric(id, el, 'Desktopy Web Kernel 1.0.0') },
            piano: { icon: 'piano-keys', color: 'text-white', pinned: false, size: [560, 420], run: (id, el) => buildGeneric(id, el, 'WebAudio API synths ready.') }
        };

        /* ---------- window manager ---------- */
        function currentRect(win) {
            return {
                x: parseFloat(win.style.left) || 0,
                y: parseFloat(win.style.top) || 0,
                w: win.offsetWidth || 680,
                h: win.offsetHeight || 440
            };
        }

        function layerRect() {
            const layer = document.getElementById('window-layer');
            return { w: layer.clientWidth, h: layer.clientHeight };
        }

        function createWindow(id, opts = {}) {
            if (!apps[id]) return null;
            const layer = document.getElementById('window-layer');
            const [dw, dh] = apps[id].size;
            const z = opts.z || (state.zIndexCounter + 1);
            state.zIndexCounter = Math.max(state.zIndexCounter, z);

            const win = document.createElement('div');
            win.id = `win-${id}`;
            win.className = 'os-window text-gray-200 pointer-events-auto';
            win.style.zIndex = z;
            win.style.width = (opts.rect ? opts.rect.w : dw) + 'px';
            win.style.height = (opts.rect ? opts.rect.h : dh) + 'px';

            // Initial placement (cascade) when no rect is supplied.
            const count = Object.keys(state.windows).length;
            const offset = count * 28;
            const L = layerRect();
            let x, y;
            if (opts.rect) {
                x = Math.max(6, Math.min(opts.rect.x, L.w - 90));
                y = Math.max(6, Math.min(opts.rect.y, L.h - 60));
            } else if (state.lang === 'ar') {
                x = Math.max(6, L.w - (opts.rect ? opts.rect.w : dw) - 110 - offset);
                y = 64 + offset;
            } else {
                x = Math.min(L.w - (opts.rect ? opts.rect.w : dw) - 6, 110 + offset);
                y = 64 + offset;
            }
            win.style.left = x + 'px';
            win.style.top = y + 'px';

            const title = i18n[state.lang][id] || id;
            win.innerHTML = `
                <div class="window-header h-10 border-b border-white/5 flex items-center px-3 gap-2 select-none relative shrink-0" dir="ltr">
                    <div class="flex items-center gap-1.5">
                        <button class="traffic bg-red-500 hover:bg-red-400 btn-close" onclick="closeApp('${id}')" title="Close"><i class="ph ph-x"></i></button>
                        <button class="traffic bg-yellow-500 hover:bg-yellow-400" onclick="toggleMinimize('${id}')" title="Minimize"><i class="ph ph-minus"></i></button>
                        <button class="traffic bg-green-500 hover:bg-green-400" onclick="toggleMaximize('${id}')" title="Maximize"><i class="ph ph-arrows-out"></i></button>
                    </div>
                    <div class="flex items-center gap-2 flex-1 min-w-0 justify-center">
                        <i class="ph ph-${apps[id].icon} ${apps[id].color} text-sm shrink-0"></i>
                        <span class="text-xs font-semibold truncate app-title" data-i18n-id="${id}">${title}</span>
                    </div>
                    <div class="w-12"></div>
                </div>
                <div class="flex-1 relative overflow-hidden bg-os-900/30" id="win-body-${id}"></div>
                <div class="resize-handle" data-dir="nw"></div><div class="resize-handle" data-dir="n"></div><div class="resize-handle" data-dir="ne"></div>
                <div class="resize-handle" data-dir="w"></div><div class="resize-handle" data-dir="e"></div>
                <div class="resize-handle" data-dir="sw"></div><div class="resize-handle" data-dir="s"></div><div class="resize-handle" data-dir="se"></div>
            `;

            const entry = state.windows[id] = {
                element: win,
                minimized: false,
                maximized: false,
                z,
                rect: opts.rect ? { x, y, w: Math.max(300, opts.rect.w), h: Math.max(220, opts.rect.h) } : null
            };

            layer.appendChild(win);
            setupDragging(win, id);
            setupResizing(win, id);

            if (opts.maximized) maximizeWindow(id, true);
            if (opts.minimized) {
                win.classList.add('minimized');
                entry.minimized = true;
            }

            apps[id].run(id, document.getElementById(`win-body-${id}`));
            updateDock();
            return entry;
        }

        function openApp(id) {
            if (state.windows[id]) {
                focusWindow(id);
                if (state.windows[id].minimized) toggleMinimize(id);
                return;
            }
            closeLauncher();
            createWindow(id);
            focusWindow(id);
            saveStateDebounced();
        }

        function focusActiveApp() {
            if (state.activeId && state.windows[state.activeId]) {
                if (state.windows[state.activeId].minimized) toggleMinimize(state.activeId);
                else focusWindow(state.activeId);
            }
        }

        function focusWindow(id) {
            const w = state.windows[id];
            if (!w) return;
            state.zIndexCounter++;
            w.z = state.zIndexCounter;
            w.element.style.zIndex = state.zIndexCounter;
            state.activeId = id;
            document.querySelectorAll('.os-window').forEach((el) => el.classList.remove('focused'));
            w.element.classList.add('focused');
            document.getElementById('active-app-title').innerText = i18n[state.lang][id] || id;
            document.getElementById('active-app-title').setAttribute('data-i18n-id', id);
            saveStateDebounced();
        }

        function closeApp(id) {
            const w = state.windows[id];
            if (!w) return;
            w.element.style.transition = 'transform .18s ease, opacity .18s ease';
            w.element.style.transform = 'scale(.9)';
            w.element.style.opacity = '0';
            setTimeout(() => {
                if (!state.windows[id]) return;
                const intv = w.element.querySelector('[data-interval]');
                if (intv && intv.dataset.interval) clearInterval(parseInt(intv.dataset.interval, 10));
                w.element.remove();
                delete state.windows[id];
                if (state.activeId === id) {
                    state.activeId = null;
                    const left = Object.keys(state.windows);
                    if (left.length) {
                        // Focus the topmost (highest z) remaining window.
                        const top = left.sort((a, b) => (state.windows[b].z || 0) - (state.windows[a].z || 0))[0];
                        focusWindow(top);
                    } else {
                        document.getElementById('active-app-title').innerText = 'Desktopy OS';
                        document.getElementById('active-app-title').removeAttribute('data-i18n-id');
                    }
                }
                updateDock();
                saveStateDebounced();
            }, 190);
        }

        function toggleMaximize(id) {
            const w = state.windows[id];
            if (!w) return;
            if (w.maximized) restoreWindow(id);
            else maximizeWindow(id, false);
            updateDock();
        }

        function maximizeWindow(id, silent) {
            const w = state.windows[id];
            if (!w || w.maximized) return;
            const L = layerRect();
            w.prevRect = w.rect || currentRect(w.element);
            w.element.style.left = '0px';
            w.element.style.top = '0px';
            w.element.style.width = L.w + 'px';
            w.element.style.height = L.h + 'px';
            w.element.classList.add('maximized');
            w.maximized = true;
            if (!silent) { focusWindow(id); saveStateDebounced(); }
        }

        function restoreWindow(id) {
            const w = state.windows[id];
            if (!w) return;
            const r = w.prevRect || w.rect || currentRect(w.element);
            w.rect = { x: r.x, y: r.y, w: r.w, h: r.h };
            w.element.style.left = r.x + 'px';
            w.element.style.top = r.y + 'px';
            w.element.style.width = r.w + 'px';
            w.element.style.height = r.h + 'px';
            w.element.classList.remove('maximized');
            w.maximized = false;
            saveStateDebounced();
        }

        function toggleMinimize(id) {
            const w = state.windows[id];
            if (!w) return;
            if (w.minimized) {
                w.element.classList.remove('minimized');
                w.minimized = false;
                focusWindow(id);
            } else {
                w.element.classList.add('minimized');
                w.minimized = true;
            }
            updateDock();
            saveStateDebounced();
        }

        /* ---------- dragging with edge snap ---------- */
        function setupDragging(win, id) {
            const header = win.querySelector('.window-header');
            let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;

            const onDown = (e) => {
                if (e.target.closest('button')) return;
                if (state.windows[id].maximized) return;
                dragging = true;
                sx = e.clientX; sy = e.clientY;
                ox = parseFloat(win.style.left) || win.offsetLeft;
                oy = parseFloat(win.style.top) || win.offsetTop;
                win.classList.add('dragging');
                header.setPointerCapture(e.pointerId);
            };
            const onMove = (e) => {
                if (!dragging) return;
                const L = layerRect();
                let x = ox + (e.clientX - sx);
                let y = oy + (e.clientY - sy);
                x = Math.max(-win.offsetWidth + 90, Math.min(x, L.w - 90));
                y = Math.max(0, Math.min(y, L.h - 46));
                win.style.left = x + 'px';
                win.style.top = y + 'px';
            };
            const onUp = (e) => {
                if (!dragging) return;
                dragging = false;
                win.classList.remove('dragging');
                try { header.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
                snapWindow(win, id);
                const w = state.windows[id];
                if (w && !w.maximized) w.rect = currentRect(win);
                saveStateDebounced();
            };
            header.addEventListener('pointerdown', onDown);
            header.addEventListener('pointermove', onMove);
            header.addEventListener('pointerup', onUp);
            header.addEventListener('pointercancel', onUp);
            header.addEventListener('dblclick', (e) => {
                if (!e.target.closest('button')) toggleMaximize(id);
            });
        }

        function snapWindow(win, id) {
            const w = state.windows[id];
            if (!w || w.maximized) return;
            const L = layerRect();
            const r = currentRect(win);
            const snapZone = 8;
            if (r.y <= snapZone) {
                w.prevRect = w.rect || r;
                maximizeWindow(id, true);
                w.element.classList.add('focused');
            } else if (r.x <= snapZone && r.x > -4) {
                w.prevRect = w.rect || r;
                win.style.left = '0px';
                win.style.top = '0px';
                win.style.width = Math.floor(L.w / 2) + 'px';
                win.style.height = L.h + 'px';
                w.rect = currentRect(win);
            } else if (r.x + r.w >= L.w - snapZone) {
                w.prevRect = w.rect || r;
                win.style.left = Math.floor(L.w / 2) + 'px';
                win.style.top = '0px';
                win.style.width = Math.floor(L.w / 2) + 'px';
                win.style.height = L.h + 'px';
                w.rect = currentRect(win);
            }
        }

        /* ---------- resizing (all 8 directions, physical coords) ---------- */
        function setupResizing(win, id) {
            const handles = win.querySelectorAll('.resize-handle');
            let resizing = false, dir = '', sx = 0, sy = 0, start = null;
            const MIN_W = 320, MIN_H = 220;

            const onDown = (e) => {
                if (state.windows[id].maximized) return;
                resizing = true;
                dir = e.target.dataset.dir;
                sx = e.clientX; sy = e.clientY;
                start = currentRect(win);
                win.classList.add('dragging');
                e.target.setPointerCapture(e.pointerId);
                e.stopPropagation();
            };
            const onMove = (e) => {
                if (!resizing) return;
                const dx = e.clientX - sx;
                const dy = e.clientY - sy;
                let { x, y, w, h } = start;
                if (dir.includes('e')) w = start.w + dx;
                if (dir.includes('s')) h = start.h + dy;
                if (dir.includes('w')) { w = start.w - dx; x = start.x + dx; }
                if (dir.includes('n')) { h = start.h - dy; y = start.y + dy; }
                w = Math.max(MIN_W, w);
                h = Math.max(MIN_H, h);
                win.style.left = x + 'px';
                win.style.top = y + 'px';
                win.style.width = w + 'px';
                win.style.height = h + 'px';
            };
            const onUp = (e) => {
                if (!resizing) return;
                resizing = false;
                win.classList.remove('dragging');
                try { e.target.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
                state.windows[id].rect = currentRect(win);
                saveStateDebounced();
            };
            handles.forEach((h) => {
                h.addEventListener('pointerdown', onDown);
                h.addEventListener('pointermove', onMove);
                h.addEventListener('pointerup', onUp);
                h.addEventListener('pointercancel', onUp);
            });
        }

        /* ---------- restore persisted windows ---------- */
        function restoreWindows(windows, zIndex) {
            if (!windows || typeof windows !== 'object') return;
            state.zIndexCounter = Math.max(state.zIndexCounter, zIndex || 0);
            Object.keys(windows)
                .filter((id) => apps[id])
                .sort((a, b) => (windows[a].z || 0) - (windows[b].z || 0))
                .forEach((id) => {
                    const r = windows[id];
                    createWindow(id, {
                        rect: { x: r.x, y: r.y, w: r.w, h: r.h },
                        z: r.z,
                        maximized: !!r.maximized,
                        minimized: !!r.minimized
                    });
                });
            const open = Object.keys(state.windows);
            if (open.length) {
                const top = open.reduce((a, b) => (state.windows[a].z > state.windows[b].z ? a : b));
                focusWindow(top);
            }
        }

        /* ============================================================
         * App builders
         * ============================================================ */

        /* ---------- terminal (filesystem-aware) ---------- */
        function resolvePath(cwd, arg) {
            if (!arg) return cwd;
            const parts = [];
            const segs = (arg.startsWith('/') ? arg : cwd + '/' + arg).split('/').filter(Boolean);
            for (const s of segs) {
                if (s === '.') continue;
                if (s === '..') { if (parts.length) parts.pop(); }
                else parts.push(s);
            }
            return parts.join('/') || 'home';
        }

        function buildTerminal(id, container) {
            container.innerHTML = `
                <div class="h-full bg-os-900/90 font-mono text-[13px] p-3 flex flex-col overflow-hidden text-green-400" dir="ltr">
                    <div id="term-out-${id}" class="flex-1 overflow-y-auto whitespace-pre-wrap leading-relaxed pb-2">Desktopy OS v1.0.0 (Web-Kernel)
Type 'help' for available commands.
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span id="term-prompt-${id}" class="text-blue-400 font-bold shrink-0">root@desktopy:~/home$</span>
                        <input type="text" id="term-in-${id}" class="flex-1 bg-transparent border-none outline-none text-green-400" autocomplete="off" spellcheck="false" autofocus>
                    </div>
                </div>
            `;

            const inp = document.getElementById(`term-in-${id}`);
            const out = document.getElementById(`term-out-${id}`);
            container.dataset.cwd = 'home';

            const prompt = () => `root@desktopy:~/home${container.dataset.cwd === 'home' ? '' : '/' + container.dataset.cwd}$`;
            const print = (text, cls = 'text-green-400') => {
                out.innerHTML += `<span class="${cls}">${esc(text)}</span>\n`;
                out.scrollTop = out.scrollHeight;
            };
            const updatePrompt = () => {
                const p = document.getElementById(`term-prompt-${id}`);
                if (p) p.innerText = prompt();
            };

            const HELP = [
                'help, clear, date, echo, whoami, neofetch',
                'pwd, ls [path], cd [path], tree',
                'cat <file>, touch <file>, mkdir <dir>',
                'rm <path>, write <file> <text...>',
                'theme [dark|light], lang [ar|en]',
                'state, disk, sysinfo, history, clear'
            ];

            async function runCommand(cmd) {
                const trimmed = cmd.trim();
                if (!trimmed) return;
                const parts = trimmed.split(/\s+/);
                const name = parts[0].toLowerCase();
                const args = parts.slice(1);
                const cwd = container.dataset.cwd || 'home';

                state.history = (state.history || []).concat(trimmed).slice(-30);

                switch (name) {
                    case 'help':
                        print(HELP.join('\n'), 'text-gray-400');
                        break;
                    case 'clear':
                        out.innerHTML = '';
                        return;
                    case 'date':
                        print(new Date().toString());
                        break;
                    case 'echo':
                        print(args.join(' '));
                        break;
                    case 'whoami':
                        print('root (Web Administrator)');
                        break;
                    case 'neofetch':
                        print(`       .---.       OS: Desktopy OS Web\n      /     \\\\      Kernel: WebKit DOM Engine\n     | () () |     Shell: Bash-simulated (JS + PHP)\n      \\\\  _  /      Theme: ${state.theme} / ${state.accent}\n       \`---\`       Font: Fira Code`, 'text-cyan-300');
                        break;
                    case 'pwd':
                        print('/home' + (cwd === 'home' ? '' : '/' + cwd));
                        break;
                    case 'ls': {
                        const target = resolvePath(cwd, args[0]);
                        const r = await Backend.ls(target);
                        if (!r.ok) { print(r.error, 'text-red-400'); break; }
                        if (!r.entries.length) { print('(empty)', 'text-gray-500'); break; }
                        r.entries.forEach((e) => {
                            const size = e.type === 'dir' ? 'DIR' : String(e.size).padStart(6);
                            print(`${e.type === 'dir' ? 'drwxr-xr-x' : '-rw-r--r--'}  ${size}  ${e.name}${e.type === 'dir' ? '/' : ''}`, e.type === 'dir' ? 'text-blue-300' : 'text-green-400');
                        });
                        break;
                    }
                    case 'tree': {
                        const root = resolvePath(cwd, args[0]);
                        const lines = ['']; let count = 0;
                        async function walk(dir, prefix) {
                            const r = await Backend.ls(dir);
                            if (!r.ok) return;
                            const entries = r.entries;
                            for (let i = 0; i < entries.length; i++) {
                                const e = entries[i];
                                const last = i === entries.length - 1;
                                lines.push(prefix + (last ? '└── ' : '├── ') + e.name + (e.type === 'dir' ? '/' : ''));
                                count++;
                                if (count < 60 && e.type === 'dir') await walk(e.path, prefix + (last ? '    ' : '│   '));
                            }
                        }
                        await walk(root, '');
                        print(lines.join('\n') || '(empty)', 'text-gray-400');
                        break;
                    }
                    case 'cd': {
                        const target = resolvePath(cwd, args[0] || 'home');
                        const r = await Backend.ls(target);
                        if (!r.ok) { print(`cd: no such directory: ${args[0] || ''}`, 'text-red-400'); break; }
                        container.dataset.cwd = target;
                        updatePrompt();
                        break;
                    }
                    case 'cat': {
                        if (!args[0]) { print('usage: cat <file>', 'text-yellow-400'); break; }
                        const r = await Backend.read(resolvePath(cwd, args[0]));
                        if (!r.ok) { print(r.error, 'text-red-400'); break; }
                        print(r.content);
                        break;
                    }
                    case 'touch': {
                        const r = await Backend.write(resolvePath(cwd, args[0] || 'untitled'), '');
                        print(r.ok ? `created ${r.path}` : r.error, r.ok ? 'text-green-400' : 'text-red-400');
                        break;
                    }
                    case 'mkdir': {
                        if (!args[0]) { print('usage: mkdir <dir>', 'text-yellow-400'); break; }
                        const r = await Backend.mkdir(resolvePath(cwd, args[0]));
                        print(r.ok ? `created directory ${r.path}` : r.error, r.ok ? 'text-green-400' : 'text-red-400');
                        break;
                    }
                    case 'rm': {
                        if (!args[0]) { print('usage: rm <path>', 'text-yellow-400'); break; }
                        const r = await Backend.rm(resolvePath(cwd, args[0]));
                        print(r.ok ? 'removed' : r.error, r.ok ? 'text-green-400' : 'text-red-400');
                        break;
                    }
                    case 'write': {
                        if (args.length < 2) { print('usage: write <file> <text...>', 'text-yellow-400'); break; }
                        const r = await Backend.write(resolvePath(cwd, args[0]), args.slice(1).join(' '));
                        print(r.ok ? `written ${r.path}` : r.error, r.ok ? 'text-green-400' : 'text-red-400');
                        break;
                    }
                    case 'theme':
                        if (args[0] === 'dark' || args[0] === 'light') toggleTheme(args[0]);
                        else print('usage: theme [dark|light]', 'text-yellow-400');
                        break;
                    case 'lang':
                        if (args[0] === 'ar' || args[0] === 'en') toggleLang(args[0]);
                        else print('usage: lang [ar|en]', 'text-yellow-400');
                        break;
                    case 'state': {
                        const wins = Object.keys(state.windows).length;
                        print(`backend: ${state.backend ? 'PHP ' + (Backend.phpVersion || '') : 'localStorage'}\ntheme: ${state.theme} | lang: ${state.lang} | accent: ${state.accent}\nwindows: ${wins} | notes: ${state.notes.length} chars | history: ${state.history.length} cmds`, 'text-gray-300');
                        break;
                    }
                    case 'disk': {
                        const r = await Backend.disk();
                        if (!r.ok) { print(r.error, 'text-red-400'); break; }
                        print(`storage: ${(r.total / 1024).toFixed(1)} KB across ${r.files} files`, 'text-cyan-300');
                        break;
                    }
                    case 'sysinfo': {
                        print(`Desktopy Web Kernel 1.0.0\nPHP backend: ${state.backend ? 'online' : 'offline'}`, 'text-gray-300');
                        break;
                    }
                    case 'history':
                        print((state.history || []).map((h, i) => `${i + 1}  ${h}`).join('\n') || '(empty)', 'text-gray-400');
                        break;
                    default:
                        print(`bash: ${name}: command not found`, 'text-red-400');
                }
                saveStateDebounced();
            }

            // Serialize commands so output order is deterministic.
            let cmdChain = Promise.resolve();
            inp.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter') return;
                const cmd = inp.value;
                inp.value = '';
                out.innerHTML += `<span class="text-blue-400 font-bold">${prompt()}</span> ${cmd.replace(/</g, '&lt;')}\n`;
                cmdChain = cmdChain
                    .then(() => runCommand(cmd))
                    .catch((err) => print('error: ' + err, 'text-red-400'))
                    .then(() => { out.scrollTop = out.scrollHeight; });
            });
            container.addEventListener('pointerdown', () => inp.focus());
            updatePrompt();
        }

        /* ---------- calculator ---------- */
        function buildCalculator(id, container) {
            container.innerHTML = `
                <div class="h-full bg-os-800 flex flex-col p-4" dir="ltr">
                    <div id="calc-display-${id}" class="h-20 bg-os-900 border border-white/5 rounded-xl mb-4 text-right px-4 flex items-center justify-end text-3xl font-mono text-white overflow-hidden shadow-inner">0</div>
                    <div class="grid grid-cols-4 gap-2 flex-1">
                        ${['C', '/', '*', '-', '7', '8', '9', '+', '4', '5', '6', '=', '1', '2', '3', '0', '.', 'Del'].map((btn) => {
                let cls = "bg-os-700 hover:bg-os-600 rounded-xl text-lg font-bold transition flex items-center justify-center text-white cursor-pointer active:scale-95";
                if (btn === '=') cls += " row-span-2 bg-indigo-600 hover:bg-indigo-500";
                if (btn === '0') cls += " col-span-2";
                if (['/', '*', '-', '+', 'C', 'Del'].includes(btn)) cls += " text-indigo-300";
                return `<button class="${cls}" onclick="calcPress('${id}', '${btn}')">${btn}</button>`;
            }).join('')}
                    </div>
                </div>
            `;
            container.dataset.val = '';
        }

        function calcPress(id, key) {
            const container = document.getElementById(`win-body-${id}`);
            if (!container) return;
            const display = document.getElementById(`calc-display-${id}`);
            let val = container.dataset.val || '';
            if (key === 'C') val = '';
            else if (key === 'Del') val = val.slice(0, -1);
            else if (key === '=') {
                try { val = new Function('return ' + val)().toString(); } catch (e) { val = 'Error'; }
            } else val += key;
            container.dataset.val = val;
            display.innerText = val || '0';
        }

        /* ---------- paint ---------- */
        function buildPaint(id, container) {
            container.innerHTML = `
                <div class="h-full flex flex-col bg-os-800">
                    <div class="h-12 bg-os-900/50 border-b border-white/5 flex items-center px-3 gap-3 shrink-0">
                        <input type="color" id="paint-color-${id}" value="#6366f1" class="w-8 h-8 rounded cursor-pointer border-none bg-transparent">
                        <input type="range" id="paint-size-${id}" min="1" max="24" value="4" class="w-24 cursor-pointer">
                        <button onclick="paintClear('${id}')" class="px-3 py-1 bg-white/10 hover:bg-white/20 rounded text-xs transition cursor-pointer">Clear</button>
                        <div class="flex-1"></div>
                        <button onclick="paintSave('${id}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-medium transition cursor-pointer">Save PNG</button>
                    </div>
                    <div class="flex-1 bg-white relative cursor-crosshair overflow-hidden">
                        <canvas id="canvas-${id}" width="1600" height="1200" class="absolute top-0 start-0"></canvas>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const canvas = document.getElementById(`canvas-${id}`);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let painting = false;
                function draw(e) {
                    if (!painting) return;
                    const rect = canvas.getBoundingClientRect();
                    const p = e.type.includes('touch') ? e.touches[0] : e;
                    const x = (p.clientX - rect.left) * (canvas.width / rect.width);
                    const y = (p.clientY - rect.top) * (canvas.height / rect.height);
                    ctx.lineWidth = document.getElementById(`paint-size-${id}`).value * (canvas.width / rect.width);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.strokeStyle = document.getElementById(`paint-color-${id}`).value;
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                }
                const start = (e) => { painting = true; draw(e); };
                const end = () => { painting = false; ctx.beginPath(); };
                canvas.addEventListener('pointerdown', start);
                canvas.addEventListener('pointermove', draw);
                canvas.addEventListener('pointerup', end);
                canvas.addEventListener('pointerleave', end);
            }, 120);
        }

        function paintClear(id) {
            const canvas = document.getElementById(`canvas-${id}`);

            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = `desktopy-paint-${Date.now()}.png`;
            a.click();
            toast('PNG exported', 'ok');
        }

        /* ---------- tic tac toe ---------- */
        function buildTicTacToe(id, container) {
            let board = ['', '', '', '', '', '', '', '', ''];
            let turn = 'X';
            let over = false;
            const winLines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            const check = () => {
                for (const [a, b, c] of winLines) {
                    if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
                }
                return board.includes('') ? null : 'draw';
            };
            const render = () => {
                container.innerHTML = `
                    <div class="h-full bg-os-800 flex flex-col items-center justify-center gap-4 p-6">
                        <div class="text-xs font-mono text-gray-400" id="ttt-status-${id}">${over ? (check() === 'draw' ? 'Draw!' : `${check()} wins!`) : `${turn}'s turn`}</div>
                        <div class="grid grid-cols-3 gap-2">
                            ${board.map((v, i) => `<button onclick="tttPress('${id}', ${i})" class="w-16 h-16 bg-os-900 border border-white/10 rounded-xl text-2xl font-bold transition hover:border-indigo-500 cursor-pointer ${v ? '' : 'hover:bg-white/5'}">${v === 'X' ? '<span class="text-indigo-400">X</span>' : v === 'O' ? '<span class="text-rose-400">O</span>' : ''}</button>`).join('')}
                        </div>
                        <button onclick="tttReset('${id}')" class="btn-ghost text-xs">Restart</button>
                    </div>`;
            };
            window[`tttPress_${id}`] = (i) => {
                if (over || board[i]) return;
                board[i] = turn;
                const w = check();
                if (w) over = true;
                else turn = turn === 'X' ? 'O' : 'X';
                render();
            };
            window[`tttReset_${id}`] = () => {
                board = ['', '', '', '', '', '', '', '', ''];
                turn = 'X'; over = false;
                render();
            };
            render();
        }

        function tttPress(id, i) { if (window[`tttPress_${id}`]) window[`tttPress_${id}`](i); }

            container.querySelectorAll('[data-fs]').forEach((btn) => {

                    const stack = JSON.parse(container.dataset.stack || '[]');

                    if (act === 'back') {
                        const prev = stack.pop();
                        container.dataset.stack = JSON.stringify(stack);
                        if (prev) loadDir(id, container, prev);
                    } else if (act === 'up') {
                        if (path !== 'home') {
                            stack.push(path);
                            container.dataset.stack = JSON.stringify(stack);
                            loadDir(id, container, path.split('/').slice(0, -1).join('/') || 'home');
                        }
