                        loadDir(id, container, path);
                    } else if (act === 'new-file' || act === 'new-folder') {
                        const isFile = act === 'new-file';
                        promptBox(isFile ? T('new_file_prompt') : T('new_folder_prompt'), '', isFile ? 'name.txt' : 'folder').then(async (name) => {
                            if (!name) return;
                            const target = path + '/' + name;
                            const r = isFile ? await Backend.write(target, '') : await Backend.mkdir(target);
                            if (r.ok) { toast(T('created'), 'ok'); loadDir(id, container, path); }
                            else toast(r.error || T('error'), 'err');
                        });
                    } else if (act === 'rename') {
                        if (!sel) { toast('Select an item first', 'warn'); return; }
                        promptBox(T('rename_prompt'), sel.split('/').pop()).then(async (name) => {
                            if (!name) return;
                            const r = await Backend.mv(sel, path + '/' + name);
                            if (r.ok) { toast(T('renamed'), 'ok'); loadDir(id, container, path); }
                            else toast(r.error || T('error'), 'err');
                        });
                    } else if (act === 'delete') {
                        if (!sel) { toast('Select an item first', 'warn'); return; }
                        confirmBox(T('delete'), T('delete_confirm'), T('delete')).then(async (ok) => {
                            if (!ok) return;
                            const r = await Backend.rm(sel);
                            if (r.ok) { toast(T('file_deleted'), 'ok'); loadDir(id, container, path); }
                            else toast(r.error || T('error'), 'err');
                        });
                    }
                });
            });

            loadDir(id, container, 'home');
        }

        function fmtSize(n) {
            if (n == null) return '—';
            if (n < 1024) return n + ' B';
            if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
            return (n / 1048576).toFixed(1) + ' MB';
        }

        async function loadDir(id, container, path) {
            const body = document.getElementById(`fs-body-${id}`);
            const status = document.getElementById(`fs-status-${id}`);
            const crumbs = document.getElementById(`fs-crumbs-${id}`);
            body.innerHTML = '<div class="text-xs text-gray-500 p-4">Loading…</div>';
            const r = await Backend.ls(path || 'home');
            if (!r.ok) {
                body.innerHTML = `<div class="text-xs text-red-400 p-4"><i class="ph ph-warning"></i> ${r.error}</div>`;
                return;
            }
            container.dataset.path = r.path;
            container.dataset.entries = JSON.stringify(r.entries);
            container.dataset.selected = '';
            const entries = r.entries;

            const segs = r.path.split('/').filter(Boolean);
            let acc = '';
            crumbs.innerHTML = segs.map((s, i) => {
                acc = i === 0 ? s : acc + '/' + s;
                const label = s === 'home' ? '<i class="ph ph-house"></i>' : esc(s);
                return `<button data-crumb="${esc(acc)}" class="hover:text-indigo-300 transition cursor-pointer px-1">${label}</button>`;
            }).join('<span class="text-gray-600">/</span>');
            crumbs.querySelectorAll('[data-crumb]').forEach((b) => {
                b.addEventListener('click', () => {
                    const target = b.dataset.crumb;
                    if (target !== container.dataset.path) {
                        const stack = JSON.parse(container.dataset.stack || '[]');
                        stack.push(container.dataset.path);
                        container.dataset.stack = JSON.stringify(stack);
                        loadDir(id, container, target);
                    }
                });
            });

            status.innerText = `${entries.length} ${T('items')}`;
            if (!entries.length) {
                body.innerHTML = `<div class="text-xs text-gray-500 p-6 text-center">${T('empty_folder')}</div>`;
                return;
            }

            body.innerHTML = '';
            entries.forEach((e) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-3 px-3 py-2 rounded-xl border border-transparent hover:bg-white/5 transition cursor-pointer';
                row.dataset.path = e.path;
                row.dataset.type = e.type;
                const icon = e.type === 'dir' ? 'ph-folder-open text-amber-300' : 'ph-file-text text-blue-300';
                const meta = e.type === 'dir' ? T('folder') : fmtSize(e.size);
                row.innerHTML = `
                    <i class="ph ${icon} text-xl"></i>
                    <div class="flex-1 min-w-0">
                        <div class="text-[13px] font-medium truncate">${esc(e.name)}</div>
                        <div class="text-[10px] text-gray-500">${meta}</div>
                    </div>
                `;
                row.addEventListener('click', () => {
                    container.dataset.selected = e.path;
                    body.querySelectorAll('[data-path]').forEach((el) => el.classList.remove('!bg-white/10', '!border-indigo-500/40'));
                    row.classList.add('!bg-white/10', '!border-indigo-500/40');
                    status.innerText = `${entries.length} ${T('items')} · ${e.name}`;
                });
                row.addEventListener('dblclick', async () => {
                    if (e.type === 'dir') {
                        const stack = JSON.parse(container.dataset.stack || '[]');
                        stack.push(container.dataset.path);
                        container.dataset.stack = JSON.stringify(stack);
                        loadDir(id, container, e.path);
                    } else {
                        const fr = await Backend.read(e.path);
                        if (fr.ok) previewBox(`${T('preview_of')} ${e.name}`, fr.content);
                        else toast(fr.error || T('error'), 'err');
                    }
                });
                body.appendChild(row);
            });
        }

                    </div>
                    <h3 class="text-2xl font-bold mb-2 relative z-10">${title}</h3>
                    <div class="w-full max-w-sm bg-os-900/80 rounded-lg p-4 border border-white/5 relative z-10 ${isTechnical ? 'text-left font-mono text-green-400' : 'text-gray-400'}" ${isTechnical ? 'dir="ltr"' : ''}>
                        ${msg}
                    </div>
                </div>
            `;
        }

        /* ============================================================
         * Launcher, dock, theme, clock, boot
         * ============================================================ */

        function renderLauncher() {
            const grid = document.getElementById('launcher-grid');
            grid.innerHTML = '';
            const search = document.getElementById('launcher-search').value.toLowerCase();
            let shown = 0;
            Object.keys(apps).forEach((id) => {
                const name = i18n[state.lang][id] || id;
                if (search && !name.toLowerCase().includes(search)) return;
                shown++;
                const running = !!state.windows[id];
                const btn = document.createElement('button');
                btn.className = 'launch-tile flex flex-col items-center gap-3 p-4 rounded-2xl cursor-pointer';
                btn.innerHTML = `
                    <div class="w-16 h-16 rounded-2xl bg-os-800 border border-white/5 flex items-center justify-center shadow-lg launch-icon relative">
                        <i class="ph ph-${apps[id].icon} ${apps[id].color} text-3xl drop-shadow-md"></i>
                        ${running ? '<span class="absolute bottom-1.5 w-1.5 h-1.5 rounded-full bg-emerald-400"></span>' : ''}
                    </div>
                    <span class="text-xs font-medium text-gray-300">${name}</span>`;
                btn.onclick = () => openApp(id);
                grid.appendChild(btn);
            });
            document.getElementById('launcher-status').innerText = shown ? `${shown} apps` : '';
        }

        function toggleLauncher(force) {
            state.launcherOpen = force !== undefined ? force : !state.launcherOpen;
            const overlay = document.getElementById('launcher-overlay');
            if (state.launcherOpen) {
                overlay.classList.add('active');
                renderLauncher();
                document.getElementById('launcher-search').focus();
            } else {
                overlay.classList.remove('active');
            }
            saveStateDebounced();
        }

        function closeLauncher() {
            if (state.launcherOpen) toggleLauncher(false);
        }

        document.getElementById('launcher-search').addEventListener('input', renderLauncher);

        /* ---------- dock ---------- */
        function updateDock() {
            const pinned = document.getElementById('dock-pinned');
            const running = document.getElementById('dock-running');
            pinned.innerHTML = '';
            running.innerHTML = '';
            let runningCount = 0;
            Object.keys(apps).forEach((id) => {
                const isRunning = !!state.windows[id];
                const isPinned = apps[id].pinned;
                if (!isPinned && !isRunning) return;
                const btn = document.createElement('button');
                btn.className = `dock-btn ${isRunning ? 'running' : ''}`;
                btn.innerHTML = `
                    <i class="ph ph-${apps[id].icon} ${apps[id].color} text-2xl"></i>
                    ${isRunning ? '<div class="dot"></div>' : ''}
                    <div class="dock-tip">${i18n[state.lang][id] || id}</div>`;
                btn.addEventListener('click', () => {
                    if (isRunning) {
                        if (state.windows[id].minimized) toggleMinimize(id);
                        else focusWindow(id);
                    } else openApp(id);
                });
                if (isPinned) pinned.appendChild(btn);
                else { running.appendChild(btn); runningCount++; }
            });
            document.getElementById('dock-sep').style.display = runningCount ? 'block' : 'none';
        }

        function setupDockMagnify() {
            const dock = document.getElementById('dock');
            const maxDist = 240;
            dock.addEventListener('pointermove', (e) => {
                const btns = [...dock.querySelectorAll('.dock-btn')];
                btns.forEach((b) => {
                    const r = b.getBoundingClientRect();
                    const cx = r.left + r.width / 2;
                    const dist = Math.abs(cx - e.clientX);
                    const scale = dist < maxDist ? 1 + (1 - dist / maxDist) * 0.35 : 1;
                    b.style.transform = `translateY(${(scale - 1) * -10}px) scale(${scale})`;
                });
            });
            dock.addEventListener('pointerleave', () => {
                dock.querySelectorAll('.dock-btn').forEach((b) => { b.style.transform = ''; });
            });
        }

        /* ---------- theme / language / accent ---------- */
        function setAccent(id) {
            state.accent = id;
            ACCENTS.forEach((a) => document.body.classList.remove('accent-' + a.id));
            document.body.classList.add('accent-' + id);
            saveStateDebounced();
            if (state.launcherOpen) renderLauncher();
        }

        function toggleTheme(force) {
            state.theme = force || (state.theme === 'dark' ? 'light' : 'dark');
            const icon = document.getElementById('theme-icon');
            if (state.theme === 'light') {
                document.documentElement.classList.remove('dark');
                document.body.classList.add('light', 'text-gray-800');
                document.body.classList.remove('text-gray-200');
                icon.className = 'ph ph-sun text-lg';
            } else {
                document.documentElement.classList.add('dark');
                document.body.classList.add('text-gray-200');
                document.body.classList.remove('light', 'text-gray-800');
                icon.className = 'ph ph-moon text-lg';
            }
            saveStateDebounced();
        }

        function toggleLang(force) {
            state.lang = force || (state.lang === 'ar' ? 'en' : 'ar');
            document.documentElement.lang = state.lang;
            document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('btn-lang').innerText = state.lang === 'ar' ? 'EN' : 'AR';
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const k = el.dataset.i18n;
                if (i18n[state.lang][k]) el.innerText = i18n[state.lang][k];
            });
            document.querySelectorAll('[data-i18n-id]').forEach((el) => {
                const k = el.dataset.i18nId;
                if (i18n[state.lang][k]) el.innerText = i18n[state.lang][k];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
                const k = el.dataset.i18nPlaceholder;
                if (i18n[state.lang][k]) el.setAttribute('placeholder', i18n[state.lang][k]);
            });
            Object.keys(state.windows).forEach((id) => {
                const el = state.windows[id].element.querySelector('.app-title');
                if (el) el.innerText = i18n[state.lang][id] || id;
            });
            if (state.launcherOpen) renderLauncher();
            updateDock();
            updateClock();
            saveStateDebounced();
        }

        /* ---------- clock ---------- */
        function updateClock() {
            const now = new Date();
            document.getElementById('top-time').innerText = now.toLocaleTimeString(state.lang === 'ar' ? 'ar-BH' : 'en-US', { hour: 'numeric', minute: '2-digit' });
            document.getElementById('top-date').innerText = now.toLocaleDateString(state.lang === 'ar' ? 'ar-BH' : 'en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        setInterval(updateClock, 1000);

        /* ---------- desktop widget live stats ---------- */
        function renderWidgetStats() {
            const cpu = document.getElementById('w-cpu');
            if (!cpu) return;
            const tick = () => {
                const c = Math.floor(Math.random() * 14) + 4;
                const m = Math.floor(Math.random() * 10) + 30;
                cpu.innerText = c + '%';
                document.getElementById('w-cpu-bar').style.width = c + '%';
                document.getElementById('w-ram').innerText = m + '%';
                document.getElementById('w-ram-bar').style.width = m + '%';
            };
            tick();
            setInterval(tick, 2200);
            if (state.backend) {
                Backend.disk().then((r) => {
                    if (r.ok) document.getElementById('w-disk').innerText = `${(r.total / 1024).toFixed(1)} KB`;
                });
            }
        }

        /* ---------- desktop context menu + reset ---------- */
        function showDesktopMenu(x, y) {
            showContextMenu(x, y, [
                { key: 'terminal', icon: 'terminal-window', label: T('new_terminal'), action: () => openApp('terminal') },
                { key: 'files', icon: 'folder-open', label: i18n[state.lang].files, action: () => openApp('files') },
                { key: 'editor', icon: 'notepad', label: i18n[state.lang].editor, action: () => openApp('editor') },
                { key: 'settings', icon: 'gear', label: T('open_settings'), action: () => openApp('settings') },
                { sep: true },
                { key: 'theme', icon: state.theme === 'dark' ? 'sun' : 'moon', label: T('theme_mode'), action: () => toggleTheme() },
                { key: 'lang', icon: 'translate', label: T('language'), action: () => toggleLang() },
                { sep: true },
                { key: 'reset', icon: 'arrow-counter-clockwise', label: T('reset_desktop'), danger: true, action: () => resetDesktopConfirm() }
            ]);
        }

        async function doReset() {
            state.suppressSave = true; // don't let beforeunload re-create the state file
            if (state.backend) await Backend.reset();
            else localStorage.removeItem('desktopy:state');
            location.reload();
        }

        function resetDesktopConfirm() {
            confirmBox(T('reset_desktop'), T('reset_confirm'), T('confirm')).then((ok) => {
                if (ok) doReset();
            });
        }

        /* ---------- boot ---------- */
        function applyPreferences(d) {
            if (d.lang === 'en' || d.lang === 'ar') state.lang = d.lang;
            if (d.theme === 'light' || d.theme === 'dark') state.theme = d.theme;
            if (d.accent) state.accent = d.accent;
            if (typeof d.notes === 'string') state.notes = d.notes;
            if (Array.isArray(d.history)) state.history = d.history;
            toggleTheme(state.theme);
            toggleLang(state.lang);
            setAccent(state.accent);
        }

        async function boot() {
            state.backend = await Backend.init();
            const p = await loadPersisted();
            if (p.data) applyPreferences(p.data);
            restoreWindows(p.data ? p.data.windows : {}, p.data ? (p.data.zIndex || 0) : 0);
            updateClock();
            updateDock();
            setupDockMagnify();
            renderWidgetStats();
            if (!state.backend) toast(T('backend_offline'), 'warn', 4200);
            if (p.fresh) {
                setTimeout(() => openApp('terminal'), 380);
            } else if (p.data && p.data.launcher) {
                toggleLauncher(true);
            }
            // Exposed for tests & debugging.
            window.__desktopyBooted = true;
            window.__desktopy = {
                state, Backend, apps,
                openApp, closeApp, toggleTheme, toggleLang, setAccent,
                saveNow: saveStateNow, snapshot,
                resetDesktop: doReset
            };
            document.dispatchEvent(new CustomEvent('desktopy:ready'));
        }

        boot();

    </script>
</body>
